<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151A22"/>
      <stop offset="100%" stop-color="#0B0F13"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CCFF00" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bgGrad)"/>
  <rect width="400" height="400" fill="url(#glowGrad)"/>
  
  <!-- Subtle Architectural Grid Pattern -->
  <g stroke="#263140" stroke-width="0.8" opacity="0.35">
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="0" y1="320" x2="400" y2="320"/>
    <line x1="80" y1="0" x2="80" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
  </g>

  <!-- Editorial Monogram Frame -->
  <rect x="60" y="60" width="280" height="280" rx="20" fill="#12171F" stroke="#2B3648" stroke-width="1.5"/>
  <rect x="75" y="75" width="250" height="250" rx="14" fill="#0E131A" stroke="#1F2836" stroke-width="1"/>
  
  <!-- Tech Accent Marker -->
  <rect x="90" y="90" width="8" height="8" rx="2" fill="#CCFF00"/>
  <text x="108" y="98" fill="#8B949E" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="1.5">DEV_PROFILE</text>
  
  <!-- Central Stylized Initials -->
  <text x="200" y="225" text-anchor="middle" fill="#CCFF00" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="76" letter-spacing="-2">MR</text>
  <text x="200" y="260" text-anchor="middle" fill="#F0F6FC" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="16" letter-spacing="0.5">MIHIR RAVAL</text>
  <text x="200" y="282" text-anchor="middle" fill="#8B949E" font-family="'JetBrains Mono', monospace" font-size="12">PHP FULL STACK DEVELOPER</text>
  
  <!-- Corner Tech Detail -->
  <circle cx="310" cy="95" r="4" fill="#10B981"/>
  <text x="200" y="320" text-anchor="middle" fill="#586575" font-family="'JetBrains Mono', monospace" font-size="9" letter-spacing="2">GEC PALANPUR • CLASS OF 2027</text>
</svg>
