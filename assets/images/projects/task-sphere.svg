<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="tsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F141C"/>
      <stop offset="100%" stop-color="#090C10"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="500" fill="url(#tsBg)"/>
  
  <!-- Subtle Grid -->
  <g stroke="#1A222F" stroke-width="0.8" opacity="0.4">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/>
  </g>

  <!-- Window Frame -->
  <g filter="url(#shadow)">
    <rect x="40" y="35" width="720" height="430" rx="12" fill="#131923" stroke="#253142" stroke-width="1.5"/>
    
    <!-- Browser Top Bar -->
    <path d="M40 47a12 12 0 0 1 12 -12h696a12 12 0 0 1 12 12v35H40z" fill="#0D1117" stroke="#253142" stroke-width="1"/>
    
    <!-- Window Controls -->
    <circle cx="65" cy="52" r="5" fill="#EF4444"/>
    <circle cx="82" cy="52" r="5" fill="#F59E0B"/>
    <circle cx="99" cy="52" r="5" fill="#10B981"/>
    
    <!-- URL Bar -->
    <rect x="130" y="42" width="400" height="22" rx="6" fill="#161F2E" stroke="#222F42" stroke-width="1"/>
    <circle cx="145" cy="53" r="3" fill="#CCFF00"/>
    <text x="158" y="57" fill="#8B949E" font-family="'JetBrains Mono', monospace" font-size="11">tasksphere.wuaze.com/dashboard.php</text>

    <!-- App Header Inside Window -->
    <rect x="40" y="82" width="720" height="48" fill="#111721" stroke="#1D2736" stroke-width="1"/>
    <text x="65" y="112" fill="#F0F6FC" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="16">TaskSphere</text>
    <rect x="170" y="96" width="75" height="20" rx="4" fill="#1F2A3D"/>
    <text x="207" y="110" fill="#CCFF00" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">PHP &amp; MySQL</text>

    <!-- Action Button -->
    <rect x="660" y="94" width="85" height="24" rx="4" fill="#CCFF00"/>
    <text x="702" y="110" fill="#0B0F13" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700">+ New Task</text>

    <!-- Task Board Columns -->
    <!-- Column 1: Backlog / To Do -->
    <g transform="translate(60, 145)">
      <rect width="210" height="300" rx="8" fill="#0C1017" stroke="#1C2534" stroke-width="1"/>
      <text x="14" y="24" fill="#8B949E" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">PENDING TASKS</text>
      <circle cx="185" cy="20" r="8" fill="#1F2937"/>
      <text x="185" y="24" fill="#9CA3AF" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10">3</text>
      
      <!-- Card 1 -->
      <rect x="10" y="38" width="190" height="74" rx="6" fill="#151D2A" stroke="#253245" stroke-width="1"/>
      <text x="20" y="58" fill="#F0F6FC" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600">Implement MySQL Indexing</text>
      <text x="20" y="74" fill="#717D8F" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10">Optimize query times for task joins</text>
      <rect x="20" y="86" width="45" height="15" rx="3" fill="#3B2618"/>
      <text x="42" y="97" fill="#F59E0B" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9">HIGH</text>
      <text x="175" y="98" fill="#717D8F" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="9">#TK-108</text>

      <!-- Card 2 -->
      <rect x="10" y="122" width="190" height="74" rx="6" fill="#151D2A" stroke="#253245" stroke-width="1"/>
      <text x="20" y="142" fill="#F0F6FC" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600">Input Validation Sanitizer</text>
      <text x="20" y="158" fill="#717D8F" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10">Filter input tags before storage</text>
      <rect x="20" y="170" width="45" height="15" rx="3" fill="#1D2A3F"/>
      <text x="42" y="181" fill="#60A5FA" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9">MEDIUM</text>
      <text x="175" y="181" fill="#717D8F" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="9">#TK-109</text>
    </g>

    <!-- Column 2: In Progress -->
    <g transform="translate(295, 145)">
      <rect width="210" height="300" rx="8" fill="#0C1017" stroke="#1C2534" stroke-width="1"/>
      <text x="14" y="24" fill="#CCFF00" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">IN PROGRESS</text>
      <circle cx="185" cy="20" r="8" fill="#1F2937"/>
      <text x="185" y="24" fill="#CCFF00" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10">2</text>
      
      <!-- Card Active -->
      <rect x="10" y="38" width="190" height="85" rx="6" fill="#162232" stroke="#CCFF00" stroke-width="1"/>
      <text x="20" y="58" fill="#F0F6FC" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600">Session Authentication</text>
      <text x="20" y="74" fill="#94A3B8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10">PHP session logic and logout cleanup</text>
      <rect x="20" y="85" width="170" height="4" rx="2" fill="#24344D"/>
      <rect x="20" y="85" width="120" height="4" rx="2" fill="#CCFF00"/>
      <rect x="20" y="99" width="52" height="15" rx="3" fill="#1A2D23"/>
      <text x="46" y="110" fill="#10B981" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9">ACTIVE</text>
      <text x="175" y="110" fill="#717D8F" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="9">#TK-105</text>
    </g>

    <!-- Column 3: Completed -->
    <g transform="translate(530, 145)">
      <rect width="210" height="300" rx="8" fill="#0C1017" stroke="#1C2534" stroke-width="1"/>
      <text x="14" y="24" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">COMPLETED</text>
      <circle cx="185" cy="20" r="8" fill="#1F2937"/>
      <text x="185" y="24" fill="#10B981" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10">5</text>
      
      <!-- Card Done -->
      <rect x="10" y="38" width="190" height="74" rx="6" fill="#131C27" stroke="#1F2C3D" stroke-width="1"/>
      <text x="20" y="58" fill="#94A3B8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="500">Database Schema Migration</text>
      <text x="20" y="74" fill="#626E7E" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10">Created relational task tables</text>
      <rect x="20" y="86" width="38" height="15" rx="3" fill="#142C21"/>
      <text x="39" y="97" fill="#10B981" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9">DONE</text>
      <text x="175" y="98" fill="#626E7E" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="9">#TK-101</text>
    </g>
  </g>
</svg>
