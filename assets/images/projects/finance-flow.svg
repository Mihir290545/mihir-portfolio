      <text x="490" y="58" fill="#8B949E" font-family="'JetBrains Mono', monospace" font-size="11">Nov 15, 2026</text>
      <text x="655" y="58" fill="#34D399" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">+ ₹20,000</text>

