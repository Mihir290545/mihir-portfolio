      <text x="355" y="104" fill="#F87171" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9">DEV TOOLS</text>
      <text x="490" y="103" fill="#8B949E" font-family="'JetBrains Mono', monospace" font-size="11">Nov 10, 2026</text>
      <text x="655" y="103" fill="#F87171" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">- ₹2,450</text>

      <!-- Row 3 -->
      <line x1="0" y1="123" x2="680" y2="123" stroke="#1D2736" stroke-width="1"/>
      <circle cx="30" cy="144" r="5" fill="#EF4444"/>
      <text x="44" y="148" fill="#F0F6FC" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600">Academic Books &amp; Study Supplies</text>
      <rect x="320" y="136" width="78" height="18" rx="4" fill="#1C273C"/>
      <text x="359" y="149" fill="#60A5FA" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9">EDUCATION</text>
      <text x="490" y="148" fill="#8B949E" font-family="'JetBrains Mono', monospace" font-size="11">Nov 04, 2026</text>
      <text x="655" y="148" fill="#F87171" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">- ₹1,800</text>
