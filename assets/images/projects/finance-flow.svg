    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/>
  </g>

  <!-- Window Container -->
  <g filter="url(#shadow3)">
    <rect x="40" y="35" width="720" height="430" rx="12" fill="#111722" stroke="#223044" stroke-width="1.5"/>
    
    <!-- Top Bar -->
    <path d="M40 47a12 12 0 0 1 12 -12h696a12 12 0 0 1 12 12v35H40z" fill="#0C1017" stroke="#223044" stroke-width="1"/>
    <circle cx="65" cy="52" r="5" fill="#EF4444"/>
    <circle cx="82" cy="52" r="5" fill="#F59E0B"/>
