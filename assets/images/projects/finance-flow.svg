      <circle cx="30" cy="54" r="5" fill="#10B981"/>
      <text x="44" y="58" fill="#F0F6FC" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600">Internship Stipend</text>
