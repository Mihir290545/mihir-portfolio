      <circle cx="30" cy="99" r="5" fill="#EF4444"/>
      <text x="44" y="103" fill="#F0F6FC" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600">Web Hosting &amp; Domain Renewal</text>
