<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ddBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E131C"/>
      <stop offset="100%" stop-color="#080B10"/>
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#ddBg)"/>

  <!-- Subtle Blueprint Grid -->
  <g stroke="#182333" stroke-width="0.8" opacity="0.45">
    <line x1="0" y1="125" x2="800" y2="125"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Window Container -->
  <g filter="url(#shadow2)">
    <rect x="40" y="35" width="720" height="430" rx="12" fill="#111722" stroke="#222F43" stroke-width="1.5"/>
    
    <!-- Title Bar -->
    <path d="M40 47a12 12 0 0 1 12 -12h696a12 12 0 0 1 12 12v35H40z" fill="#0C1017" stroke="#222F43" stroke-width="1"/>
    <circle cx="65" cy="52" r="5" fill="#EF4444"/>
    <circle cx="82" cy="52" r="5" fill="#F59E0B"/>
    <circle cx="99" cy="52" r="5" fill="#10B981"/>

    <!-- URL / Tab Indicator -->
    <rect x="130" y="42" width="220" height="23" rx="5" fill="#172130" stroke="#25354D" stroke-width="1"/>
    <text x="145" y="58" fill="#F0F6FC" font-family="'JetBrains Mono', monospace" font-size="11">DevDock // API Tool</text>
    <circle cx="335" cy="53" r="3" fill="#10B981"/>

    <!-- Request Bar -->
    <g transform="translate(60, 90)">
      <rect width="680" height="42" rx="6" fill="#151E2B" stroke="#26364D" stroke-width="1"/>
      
      <!-- Method Badge -->
      <rect x="8" y="7" width="62" height="28" rx="4" fill="#047857"/>
      <text x="39" y="25" fill="#ECFDF5" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">POST</text>
      
      <!-- Endpoint Input Field -->
      <text x="85" y="26" fill="#F0F6FC" font-family="'JetBrains Mono', monospace" font-size="12">https://api.service.io/v1/auth/session</text>
      
      <!-- Send Button -->
      <rect x="585" y="7" width="85" height="28" rx="4" fill="#CCFF00"/>
      <text x="627" y="25" fill="#0B0F13" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700">SEND &gt;</text>
    </g>

    <!-- Content Workspace: 2-Panes (Request Body on Left, Response on Right) -->
    <!-- Left Pane: Headers & Payload -->
    <g transform="translate(60, 146)">
      <rect width="325" height="295" rx="6" fill="#0D121B" stroke="#1D2A3B" stroke-width="1"/>
      <rect width="325" height="30" rx="6" fill="#131B27"/>
      <text x="14" y="20" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">REQUEST BODY (JSON)</text>
      
      <!-- Code Lines -->
      <text x="14" y="56" fill="#717D8F" font-family="'JetBrains Mono', monospace" font-size="11">1</text>
      <text x="35" y="56" fill="#F0F6FC" font-family="'JetBrains Mono', monospace" font-size="11">{</text>

      <text x="14" y="76" fill="#717D8F" font-family="'JetBrains Mono', monospace" font-size="11">2</text>
      <text x="45" y="76" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="11">"client_id"</text>
      <text x="145" y="76" fill="#F0F6FC" font-family="'JetBrains Mono', monospace" font-size="11">:</text>
      <text x="160" y="76" fill="#CCFF00" font-family="'JetBrains Mono', monospace" font-size="11">"m_raval_dev"</text>
      <text x="270" y="76" fill="#F0F6FC" font-family="'JetBrains Mono', monospace" font-size="11">,</text>

      <text x="14" y="96" fill="#717D8F" font-family="'JetBrains Mono', monospace" font-size="11">3</text>
      <text x="45" y="96" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="11">"action"</text>
      <text x="110" y="96" fill="#F0F6FC" font-family="'JetBrains Mono', monospace" font-size="11">:</text>
      <text x="125" y="96" fill="#CCFF00" font-family="'JetBrains Mono', monospace" font-size="11">"inspect_header"</text>
      <text x="260" y="96" fill="#F0F6FC" font-family="'JetBrains Mono', monospace" font-size="11">,</text>

      <text x="14" y="116" fill="#717D8F" font-family="'JetBrains Mono', monospace" font-size="11">4</text>
      <text x="45" y="116" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="11">"format"</text>
      <text x="110" y="116" fill="#F0F6FC" font-family="'JetBrains Mono', monospace" font-size="11">:</text>
      <text x="125" y="116" fill="#CCFF00" font-family="'JetBrains Mono', monospace" font-size="11">"application/json"</text>

      <text x="14" y="136" fill="#717D8F" font-family="'JetBrains Mono', monospace" font-size="11">5</text>
      <text x="35" y="136" fill="#F0F6FC" font-family="'JetBrains Mono', monospace" font-size="11">}</text>

      <!-- Active Inspection Pill -->
      <rect x="14" y="248" width="165" height="26" rx="4" fill="#182333" stroke="#2B3C54" stroke-width="1"/>
      <circle cx="26" cy="261" r="3" fill="#60A5FA"/>
      <text x="36" y="265" fill="#93C5FD" font-family="'JetBrains Mono', monospace" font-size="10">Content-Type: JSON</text>
    </g>

    <!-- Right Pane: Response Inspector -->
    <g transform="translate(400, 146)">
      <rect width="340" height="295" rx="6" fill="#0D121B" stroke="#1D2A3B" stroke-width="1"/>
      <rect width="340" height="30" rx="6" fill="#131B27"/>
      
      <!-- Response Status Badge -->
      <rect x="14" y="6" width="70" height="18" rx="3" fill="#064E3B"/>
      <text x="49" y="19" fill="#34D399" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">200 OK</text>
      
      <text x="100" y="19" fill="#717D8F" font-family="'JetBrains Mono', monospace" font-size="10">Time: 48ms</text>
      <text x="220" y="19" fill="#717D8F" font-family="'JetBrains Mono', monospace" font-size="10">Size: 1.4 KB</text>

      <!-- Response Content -->
      <text x="14" y="56" fill="#717D8F" font-family="'JetBrains Mono', monospace" font-size="11">1</text>
      <text x="35" y="56" fill="#F0F6FC" font-family="'JetBrains Mono', monospace" font-size="11">{</text>

      <text x="14" y="76" fill="#717D8F" font-family="'JetBrains Mono', monospace" font-size="11">2</text>
      <text x="45" y="76" fill="#F472B6" font-family="'JetBrains Mono', monospace" font-size="11">"status"</text>
      <text x="110" y="76" fill="#F0F6FC" font-family="'JetBrains Mono', monospace" font-size="11">:</text>
      <text x="125" y="76" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="11">"success"</text>
      <text x="200" y="76" fill="#F0F6FC" font-family="'JetBrains Mono', monospace" font-size="11">,</text>

      <text x="14" y="96" fill="#717D8F" font-family="'JetBrains Mono', monospace" font-size="11">3</text>
      <text x="45" y="96" fill="#F472B6" font-family="'JetBrains Mono', monospace" font-size="11">"http_code"</text>
      <text x="130" y="96" fill="#F0F6FC" font-family="'JetBrains Mono', monospace" font-size="11">:</text>
      <text x="145" y="96" fill="#FBBF24" font-family="'JetBrains Mono', monospace" font-size="11">200</text>
      <text x="175" y="96" fill="#F0F6FC" font-family="'JetBrains Mono', monospace" font-size="11">,</text>

      <text x="14" y="116" fill="#717D8F" font-family="'JetBrains Mono', monospace" font-size="11">4</text>
      <text x="45" y="116" fill="#F472B6" font-family="'JetBrains Mono', monospace" font-size="11">"endpoint_verified"</text>
      <text x="210" y="116" fill="#F0F6FC" font-family="'JetBrains Mono', monospace" font-size="11">:</text>
      <text x="225" y="116" fill="#CCFF00" font-family="'JetBrains Mono', monospace" font-size="11">true</text>

      <text x="14" y="136" fill="#717D8F" font-family="'JetBrains Mono', monospace" font-size="11">5</text>
      <text x="35" y="136" fill="#F0F6FC" font-family="'JetBrains Mono', monospace" font-size="11">}</text>

      <!-- Live Inspection Pill -->
      <rect x="14" y="248" width="200" height="26" rx="4" fill="#13241C" stroke="#1D4B36" stroke-width="1"/>
      <circle cx="26" cy="261" r="3" fill="#10B981"/>
      <text x="36" y="265" fill="#6EE7B7" font-family="'JetBrains Mono', monospace" font-size="10">Response Parsed (Valid JSON)</text>
    </g>
  </g>
</svg>
